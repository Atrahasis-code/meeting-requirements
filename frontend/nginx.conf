worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  log_format safe '$remote_addr $request_method $uri $status';
  access_log /dev/stdout safe;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  sendfile on;
  # Docker can assign the API a new IP when only its container is recreated.
  resolver 127.0.0.11 valid=5s ipv6=off;
  server {
    listen 8080;
    server_name 127.0.0.1 localhost;
    root /usr/share/nginx/html;
    client_max_body_size 0;
    set $api_backend http://backend:8000;
    location = /healthz { access_log off; return 200 'ok'; }
    location /api/auth/ {
      # Opaque authorization paths contain state and must also stay out of logs.
      access_log off;
      error_log /dev/null;
      proxy_pass $api_backend;
      proxy_set_header Host $host;
    }
    location /api/ {
      proxy_pass $api_backend;
      proxy_set_header Host $host;
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_read_timeout 180s;
    }
    location = /auth/callback {
      access_log off;
      # Upstream errors can otherwise include the OAuth code in the request URI.
      error_log /dev/null;
      proxy_pass $api_backend;
      proxy_set_header Host $host;
    }
    location / { try_files $uri $uri/ /index.html; }
  }
}
