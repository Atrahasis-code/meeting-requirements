services:
  # Tests use an internal loopback listener and never bind the normal APP_PORT.
  frontend:
    ports: !reset []
  backend:
    build:
      target: test
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    environment:
      MRA_PUBLIC_URL: http://127.0.0.1:8080
      MRA_TEST_MODE: "true"
      MRA_ANALYSIS_PROVIDER: mock
      MRA_TRANSCRIPTION_PROVIDER: mock
  worker:
    build:
      target: test
    command: ["python", "-m", "app.worker"]
    environment:
      MRA_PUBLIC_URL: http://127.0.0.1:8080
      MRA_TEST_MODE: "true"
      MRA_ANALYSIS_PROVIDER: mock
      MRA_TRANSCRIPTION_PROVIDER: mock
  integration-tests:
    profiles: [test]
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: test
    # localhost now reaches the real frontend proxy inside its network namespace.
    network_mode: service:frontend
    environment:
      MRA_TEST_BASE_URL: http://localhost:8080
      MRA_TEST_MODE: "true"
    command: ["pytest", "tests/test_http_flow.py"]
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
      worker:
        condition: service_healthy
    restart: "no"
  frontend-tests:
    profiles: [test]
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: test
    command: ["npm", "test"]
    restart: "no"
