[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
cache_dir = "/tmp/mra-pytest-cache"
markers = ["real: requires a downloaded model or authorized external account"]

[tool.ruff]
target-version = "py312"
line-length = 110
cache-dir = "/tmp/mra-ruff-cache"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
